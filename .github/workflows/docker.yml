name: docker

# Publish only on version tags. Building images for every branch commit would
# fill the package registry with unreferenced layers; the release flow below
# derives the version from the tag itself, so a tag is the single source of
# truth for what gets shipped.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also push the image (manual runs otherwise build only)"
        type: boolean
        default: false
      version:
        description: "Version to tag, e.g. 1.1.0. Empty = derive from the ref."
        type: string
        required: false

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  # Alternate destination. Docker Hub is not reachable from some networks (this
  # project is developed behind one), so CI is the only place it can be pushed.
  DOCKERHUB_IMAGE: docker.io/wwbgo/github-hosts

jobs:
  # Cheap gate: the image must build from code that at least compiles cleanly
  # and passes its tests, otherwise a broken tag burns a registry version.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            # A manual run may re-publish an existing release under its own
            # version, without moving the git tag.
            VERSION="${{ inputs.version }}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version ${VERSION}"

      # Decide destinations up front. Listing docker.io in the metadata while
      # not being logged in makes the push step fail, so an unset Docker Hub
      # credential must remove the registry from the tag set, not crash later.
      - name: Resolve registries
        id: registries
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          IMAGES="${{ env.GHCR_IMAGE }}"
          if [[ -n "$DH_USER" && -n "$DH_TOKEN" ]]; then
            IMAGES="${IMAGES}"$'\n'"${{ env.DOCKERHUB_IMAGE }}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub: enabled"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub: skipped (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set)"
          fi
          {
            echo "images<<IMAGES_EOF"
            echo "$IMAGES"
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.registries.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          # `latest` and the bare major alias are only meaningful for a real
          # release; a branch build must not overwrite them.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || inputs.version != '' }}
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/v') && inputs.version == '' }}
          labels: |
            org.opencontainers.image.title=github-hosts

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### github-hosts ${{ steps.version.outputs.version }}"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
